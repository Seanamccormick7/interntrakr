name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-orchestration:
    name: Test Orchestration (Python)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install jest-junit reporter
        working-directory: ./apps/api
        run: npm install --save-dev jest-junit

      - name: Generate Prisma client
        working-directory: ./apps/api
        run: npx prisma generate

      - name: Wait for MongoDB to be ready
        run: |
          set -e
          echo "Waiting for MongoDB to accept connections..."
          for i in $(seq 1 30); do
            npx mongosh mongodb://localhost:27017 --quiet --eval "db.adminCommand({ping:1})" && {
              echo "MongoDB is ready"
              exit 0
            }
            echo "MongoDB not ready yet (attempt $i/30), sleeping 2s..."
            sleep 2
          done
          echo "Timed out waiting for MongoDB"
          exit 1

      - name: Wait for Redis to be ready
        run: |
          set -e
          if ! command -v redis-cli &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y redis-tools
          fi
          echo "Waiting for Redis to accept connections..."
          for i in $(seq 1 30); do
            if redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Redis not ready yet (attempt $i/30), sleeping 2s..."
            sleep 2
          done
          echo "Timed out waiting for Redis"
          exit 1

      - name: Clean MongoDB test database
        run: |
          npx mongosh mongodb://localhost:27017/interntrackr_test --eval "db.dropDatabase()" || echo "Database does not exist yet, skipping"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Type check API
        working-directory: ./apps/api
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Type check Web
        working-directory: ./apps/web
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./services/reco-java/gradlew

      - name: Run Python Test Orchestration
        id: test_runner
        run: python scripts/test_runner.py --coverage --ci
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/interntrackr_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          INTERNAL_API_KEY: test-api-key
          DB_ENGINE: mongo
          SCORE_SERVICE_URL: http://localhost:8080

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-reports/
            apps/api/test-results/
            apps/api/coverage/
            services/reco-java/build/test-results/
            services/reco-java/build/reports/

      - name: Upload API coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api-tests
          fail_ci_if_error: false

  node-ci:
    name: Node.js CI (Standalone)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./apps/api
        run: npx prisma generate

      - name: Wait for MongoDB to be ready
        run: |
          set -e
          echo "Waiting for MongoDB to accept connections..."
          for i in $(seq 1 30); do
            npx mongosh mongodb://localhost:27017 --quiet --eval "db.adminCommand({ping:1})" && {
              echo "MongoDB is ready"
              exit 0
            }
            echo "MongoDB not ready yet (attempt $i/30), sleeping 2s..."
            sleep 2
          done
          echo "Timed out waiting for MongoDB"
          exit 1

      - name: Wait for Redis to be ready
        run: |
          set -e
          if ! command -v redis-cli &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y redis-tools
          fi
          echo "Waiting for Redis to accept connections..."
          for i in $(seq 1 30); do
            if redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Redis not ready yet (attempt $i/30), sleeping 2s..."
            sleep 2
          done
          echo "Timed out waiting for Redis"
          exit 1

      - name: Clean MongoDB test database
        run: |
          npx mongosh mongodb://localhost:27017/interntrackr_test --eval "db.dropDatabase()" || echo "Database does not exist yet, skipping"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Type check API
        working-directory: ./apps/api
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Type check Web
        working-directory: ./apps/web
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Test API
        working-directory: ./apps/api
        run: npm test -- --coverage --maxWorkers=1
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/interntrackr_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          INTERNAL_API_KEY: test-api-key
          DB_ENGINE: mongo
          SCORE_SERVICE_URL: http://localhost:8080

      - name: Wait for MongoDB cleanup
        if: always()
        run: sleep 5

      - name: Test Web
        working-directory: ./apps/web
        run: npm test -- --coverage --maxWorkers=2 || echo "No tests found, skipping"
        continue-on-error: true
        env:
          NODE_ENV: test

      - name: Upload API coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api-tests
          fail_ci_if_error: false

  java-ci:
    name: Java CI (Standalone)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Build with Gradle
        working-directory: ./services/reco-java
        run: ./gradlew build --no-daemon

      - name: Run tests
        working-directory: ./services/reco-java
        run: ./gradlew test --no-daemon

      - name: Upload raw JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reco-java-test-results
          path: ./services/reco-java/build/test-results/test/

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        continue-on-error: true
        with:
          report_paths: "./services/reco-java/build/test-results/test/TEST-*.xml"
          fail_on_failure: false

      - name: Run code quality checks
        working-directory: ./services/reco-java
        run: ./gradlew check --no-daemon || echo "No checkstyle configured, skipping"
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-orchestration]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        working-directory: ./apps/api
        run: docker build -t interntrackr-api:${{ github.sha }} .
        continue-on-error: true

      - name: Build Web Docker image
        working-directory: ./apps/web
        run: docker build -t interntrackr-web:${{ github.sha }} .
        continue-on-error: true

      - name: Build Java service Docker image
        working-directory: ./services/reco-java
        run: docker build -t interntrackr-java:${{ github.sha }} .

  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [test-orchestration]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.test-orchestration.result }}" != "success" ]; then
            echo "Test orchestration job failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"
