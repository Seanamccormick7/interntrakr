name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter (root)
      run: npm run lint

    - name: Run linter (API)
      run: npm run lint -w apps/api

    - name: Run linter (Web)
      run: npm run lint -w apps/web

    - name: Run type check (API)
      run: npm run build -w apps/api

    - name: Run type check (Web)
      run: npm run build -w apps/web

    - name: Run tests (API)
      run: npm run test -w apps/api
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/interntrackr_test
        JWT_SECRET: test-jwt-secret

    - name: Run tests (Web)
      run: npm run test -w apps/web

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build API
      run: npm run build -w apps/api

    - name: Build Web
      run: npm run build -w apps/web

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          apps/api/dist/
          apps/web/dist/
